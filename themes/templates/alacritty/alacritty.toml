[colors.primary]
foreground = "{{foreground|hex}}"
background = "{{surface|hex}}"
dim_foreground = "{{foreground-muted|hex}}"
bright_foreground = "{{foreground-strong|hex}}"

[colors.cursor]
text = "{{surface|hex}}"
cursor = "{{foreground-strong|hex}}"

[colors.vi_mode_cursor]
text = "{{surface|hex}}"
cursor = "{{foreground-strong|hex}}"

[colors.search.matches]
foreground = "{{foreground|hex}}"
background = "{{surface-4|hex}}"

[colors.search.focused_match]
foreground = "{{on-accent|hex}}"
background = "{{accent|hex}}"

[colors.hints.start]
foreground = "{{foreground|hex}}"
background = "{{surface-4|hex}}"

[colors.hints.end]
