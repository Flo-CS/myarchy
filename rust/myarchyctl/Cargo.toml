[package]
name = "myarchyctl"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "myarchyctl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
idle-inhibitor = { path = "../idle-inhibitor", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
fd-lock = "4"
