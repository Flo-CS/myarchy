[package]
name = "myarchy-sys"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
fd-lock = "4"
myarchy-core = { path = "../myarchy-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
myarchy-core = { path = "../myarchy-core", features = ["fixtures"] }
