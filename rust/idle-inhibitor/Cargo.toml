[package]
name = "idle-inhibitor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "idle-inhibitord"
path = "src/bin/idle-inhibitord.rs"
required-features = ["daemon"]

[features]
default = ["daemon"]
daemon = ["dep:zbus"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5", optional = true }
