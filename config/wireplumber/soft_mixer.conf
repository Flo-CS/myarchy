# The sof-hda-dsp card exposes no "Speaker Playback Volume" control (only a switch), so ALSA's UCM profile falls back to "Master"/"Bass Speaker".
# Neither of which attenuates this laptop's speakers.
# Hardware volume is therefore a no-op: the sink can sit at 0% and still play at full blast.
# Doing the mixing in software makes the volume actually work.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card\\..*skl_hda_dsp_generic.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
